<div class="VDCEditorEx-Template-Grid" style="padding: 10px">
    <span style="display: flex;">
        <span data-locales-text="Search-Find"></span>
        <span class="VDCEditorEx-Gap"></span>
        <span id="VDCEditorEx-SearchClearBtn" class="VDCEditorEx-SettingsPanelBtn" data-locales-text="Search-Clear"></span>
    </span>
    <div class="VDCEditorEx-Template-Flex">
        <input type="text" id="VDCEditorEx-Search" style="width: 100%" translate="no" spellcheck="false" autocorrect="off" autocapitalize="off">
        <span id="VDCEditorEx-Search-Next" class="VDCEditorEx-Settings-Btn" style="padding: 4px; margin: 0;" data-locales-title="Search-FindNext">
            <img src="__EXT_ID__/images/symbols/findNext.png">
        </span>
    </div>
    <div style="display:block; gap:5px">
        <span data-locales-text="Search-Replace"></span>
        <div class="VDCEditorEx-Template-Flex">
            <input type="text" id="VDCEditorEx-Replace" style="width: 100%" translate="no" spellcheck="false" autocorrect="off" autocapitalize="off">
            <span id="VDCEditorEx-Search-RepNext" class="VDCEditorEx-Settings-Btn" style="padding: 4px; margin: 0;" data-locales-title="Search-ReplaceNext">
                <img src="__EXT_ID__/images/symbols/replace.png">
            </span>
            <span id="VDCEditorEx-Search-RepAll" class="VDCEditorEx-Settings-Btn" style="padding: 4px; margin: 0;" data-locales-title="Search-ReplaceAll">
                <img src="__EXT_ID__/images/symbols/replaceAll.png">
            </span>
        </div>
    </div>
    <div style="display:flex;gap: 10px;">
        <span data-locales-text="Search-CaseIns"></span>
        <span id="VDCEditorEx-Search-Ins" style="margin: 2px;" class="VDCEditorEx-Settings-Btn oo-ui-icon-check oo-ui-image-invert" checked="true"></span>
    </div>
    <div style="display:flex;gap: 10px;">
        <span data-locales-text="Search-Mode"></span>
        <select id="VDCEditorEx-Search-Mode" style="border-radius: 4px;">
            <option value="normal" data-locales-text="Search-ModeNormal"></option>
            <option value="regex" data-locales-text="Search-ModeRegex"></option>
        </select>
    </div>
</div>
<div id="VDCEditorEx-SearchDlg-Info"></div>
